name: ShopSense AI CI

on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Full-Stack CI & Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/shopsense_ai
      JWT_SECRET: ci-test-jwt-secret-key-32-characters-minimum-shopsense-2026
      ML_SERVICE_URL: http://127.0.0.1:8000
      PORT: 5000
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate Backend syntax
        run: node --check src/server.js
        working-directory: backend

      - name: Compile Python source files
        run: python -m compileall src ml-service

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      - name: Verify MongoDB readiness
        run: |
          echo "Verifying MongoDB connectivity on 127.0.0.1:27017..."
          for i in $(seq 1 30); do
            if bash -c '</dev/tcp/127.0.0.1/27017' 2>/dev/null; then
              echo "MongoDB is ready on 127.0.0.1:27017"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done
          echo "Error: MongoDB failed to become ready on 127.0.0.1:27017"
          exit 1

      - name: Start ML Service
        run: |
          echo "Starting FastAPI ML service on 127.0.0.1:8000..."
          python -m uvicorn --app-dir ml-service main:app --host 127.0.0.1 --port 8000 > /tmp/ml_service.log 2>&1 &
          echo $! > /tmp/ml_service.pid

          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "ML service is up and healthy!"
              curl -s http://127.0.0.1:8000/health
              echo ""
              exit 0
            fi
            if [ -f /tmp/ml_service.pid ] && ! kill -0 $(cat /tmp/ml_service.pid) 2>/dev/null; then
              echo "Error: ML service process terminated prematurely. Logs:"
              cat /tmp/ml_service.log
              exit 1
            fi
            echo "Waiting for ML service... ($i/30)"
            sleep 1
          done
          echo "Error: ML service timed out waiting for health check. Logs:"
          cat /tmp/ml_service.log
          exit 1

      - name: Start Express Backend
        run: |
          echo "Starting Express backend on 127.0.0.1:5000..."
          node backend/src/server.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:5000/api/health > /dev/null 2>&1; then
              HEALTH_RESP=$(curl -s http://127.0.0.1:5000/api/health)
              echo "Backend health check response: $HEALTH_RESP"
              if echo "$HEALTH_RESP" | grep -q '"database":"connected"'; then
                echo "Backend and MongoDB are connected and healthy!"
                exit 0
              fi
            fi
            if [ -f /tmp/backend.pid ] && ! kill -0 $(cat /tmp/backend.pid) 2>/dev/null; then
              echo "Error: Backend process terminated prematurely. Logs:"
              cat /tmp/backend.log
              exit 1
            fi
            echo "Waiting for Backend... ($i/30)"
            sleep 1
          done
          echo "Error: Backend timed out waiting for health check. Logs:"
          cat /tmp/backend.log
          exit 1

      - name: Run Test Suite (Pipeline and API Integration Tests)
        run: pytest -q

      - name: Print Service Logs on Failure
        if: failure()
        run: |
          echo "=== ML Service Log ==="
          cat /tmp/ml_service.log 2>/dev/null || echo "No ML service log found"
          echo "=== Backend Log ==="
          cat /tmp/backend.log 2>/dev/null || echo "No backend log found"

      - name: Stop Background Services
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) 2>/dev/null || true
          fi
          if [ -f /tmp/ml_service.pid ]; then
            kill $(cat /tmp/ml_service.pid) 2>/dev/null || true
          fi
          pkill -f "uvicorn" 2>/dev/null || true
          pkill -f "server.js" 2>/dev/null || true
